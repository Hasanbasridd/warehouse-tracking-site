name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static Validation (HTML/JS/JSON)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No build/test scripts or lockfile exist yet, so the check is
      # dependency-free: JSON configs must parse and inline scripts must compile.
      - name: Validate static files
        run: node .github/scripts/validate-static.mjs
